name: Infrastructure Monitor
version: "0.11.1"
slug: monitorha
description: >-
  Monitors MikroTik routers and switches, Proxmox VE hosts and
  Supermicro/Redfish BMCs, and feeds them to Home Assistant as native entities.
url: https://github.com/immakinbacon/monitorha
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
# Devices are configured in the add-on's own web UI, so there are no add-on
# options to fill in here.
options: {}
schema: {}
# Ingress serves the UI. The same port is what the Home Assistant integration
# connects to over the Supervisor's internal network; it is deliberately not
# published to the host.
ingress: true
ingress_port: 8099
panel_icon: mdi:server-network
panel_title: Infrastructure
# Needed to publish the discovery record that auto-configures the integration.
hassio_api: true
hassio_role: default
